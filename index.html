<!doctype html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#4f46e5">
  <meta name="description" content="QuizBoard - Free MCQ practice for students and exam preparation.">
  <title>QuizBoard - 100% Free MCQ Practice</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="brand">QuizBoard</div><div class="tagline">100% Free MCQ Practice</div></header>
  <main class="page">
    <section class="intro">
      <h1>अपना Free Quiz चुनें</h1>
      <p>अपना बोर्ड, कक्षा और विषय चुनें। हर Quiz में 10 प्रश्न होंगे।</p>
    </section>
    <section class="filters" aria-label="Quiz selection">
      <label>Board
        <select id="board">
          <option value="All">All Boards</option><option value="Bihar Board">Bihar Board</option>
          <option value="CBSE">CBSE</option><option value="UP Board">UP Board</option>
          <option value="MP Board">MP Board</option><option value="All India">All India</option>
        </select>
      </label>
      <label>Question Language
        <select id="language">
          <option value="hi">Hindi</option>
          <option value="en">English</option>
        </select>
      </label>
      <label>Class
        <select id="class"><option value="All">All Classes</option><option value="10">Class 10</option><option value="12">Class 12</option></select>
      </label>
      <label>Subject
        <select id="subject">
          <option value="All">All Subjects</option><option value="Hindi">Hindi</option>
          <option value="English">English</option><option value="Maths">Maths</option>
          <option value="Science">Science</option><option value="Social Science">Social Science</option>
          <option value="General Knowledge">General Knowledge</option>
        </select>
      </label>
      <button id="start" type="button">Start Free Quiz</button>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <section id="quiz" hidden>
      <div class="quiz-top"><strong id="progress">10 Questions</strong><span id="score-live">अंक: 0</span></div>
      <div id="question-list"></div>
      <button id="finish" type="button">Submit Quiz</button>
    </section>
    <section id="result" hidden></section>
    <div class="ad" aria-label="Advertisement placeholder">Advertisement space</div>
  </main>
  <footer>QuizBoard - Abhi 100% Free<br>Support: <a href="mailto:heluckyx7@gmail.com">heluckyx7@gmail.com</a></footer>
  <script src="questions.js?v=6"></script>
  <script src="app.js?v=6"></script>
</body>
</html>
